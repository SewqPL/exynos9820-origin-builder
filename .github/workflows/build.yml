name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      model:
        description: Model (code + device name)
        required: true
        default: beyond1lte (Galaxy S10)
        type: choice
        options:
          - beyond0lte (Galaxy S10e)
          - beyond0lteks (Galaxy S10e Korea)
          - beyond1lte (Galaxy S10)
          - beyond1lteks (Galaxy S10 Korea)
          - beyond2lte (Galaxy S10+)
          - beyond2lteks (Galaxy S10+ Korea)
          - beyondx (Galaxy S10 5G)
          - beyondxks (Galaxy S10 5G Korea)
          - d1 (Galaxy Note10)
          - d1xks (Galaxy Note10 5G)
          - d2s (Galaxy Note10+)
          - d2x (Galaxy Note10+ 5G)
          - d2xks (Galaxy Note10+ 5G Korea)
      root:
        description: Root implementation
        required: true
        default: originsu
        type: choice
        options:
          - originsu
          - rksu
          - none
      originsu_ref:
        description: "OriginSU tag (only for originsu; empty = latest release)"
        required: false
        default: ""
      hook_mode:
        description: "Hook mode (susfs = root + SuSFS, manual = manual hooks only)"
        required: true
        default: susfs
        type: choice
        options:
          - susfs
          - manual
      susfs_version:
        description: "SuSFS version (intree = 9820_kernel built-in, v2.4.0 = apply JackA1ltman patch)"
        required: true
        default: intree
        type: choice
        options:
          - intree
          - v2.4.0
      kpm:
        description: Enable CONFIG_KPM (OriginSU)
        required: false
        default: false
        type: boolean
      extra_features:
        description: Add Baseband Guard + NoMount + Droidspaces
        required: false
        default: false
        type: boolean
      recovery:
        description: Compile for Android Recovery (disables root)
        required: true
        default: n
        type: choice
        options:
          - n
          - y
      gpu_max:
        description: "GPU max MHz (for OC tables, default: 702)"
        required: true
        default: "962"
        type: choice
        options:
          - "100"
          - "156"
          - "200"
          - "260"
          - "325"
          - "377"
          - "433"
          - "572"
          - "598"
          - "650"
          - "676"
          - "702"
          - "754"
          - "806"
          - "858"
          - "910"
          - "962"
          - "1014"
          - "1066"
          - "1092"
          - "1118"
          - "1144"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Checkout origin-builder helper scripts
        if: ${{ inputs.root == 'originsu' || inputs.extra_features }}
        uses: actions/checkout@v4
        with:
          repository: SewqPL/exynos9820-origin-builder
          path: _origin_builder

      - name: Move helper scripts outside kernel workspace
        if: ${{ inputs.root == 'originsu' || inputs.extra_features }}
        run: |
          mv _origin_builder "$RUNNER_TEMP/origin-builder"

      - name: Resolve model and root settings
        id: cfg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MODEL_CODE="${{ inputs.model }}"
          MODEL_CODE="${MODEL_CODE%% *}"
          echo "model_code=$MODEL_CODE" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.recovery }}" = "y" ] || [ "${{ inputs.root }}" = "none" ]; then
            echo "include_ksu=n" >> "$GITHUB_OUTPUT"
            echo "effective_root=none" >> "$GITHUB_OUTPUT"
          else
            echo "include_ksu=y" >> "$GITHUB_OUTPUT"
            echo "effective_root=${{ inputs.root }}" >> "$GITHUB_OUTPUT"
          fi

          if [ "${{ inputs.root }}" = "originsu" ] && [ "${{ inputs.recovery }}" != "y" ]; then
            TAG="${{ inputs.originsu_ref }}"
            [ -n "$TAG" ] || TAG=$(gh release view --repo samakshkambxj/OriginSU --json tagName -q .tagName 2>/dev/null || true)
            [ -n "$TAG" ] || { echo "::error::Could not determine OriginSU release tag"; exit 1; }
            echo "originsu_tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "Resolved OriginSU tag: $TAG"
          else
            echo "originsu_tag=na" >> "$GITHUB_OUTPUT"
          fi

          echo "Resolved model code: $MODEL_CODE"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            cpio \
            flex \
            curl \
            git-core \
            zlib1g-dev \
            libc6-dev-i386 \
            lib32z1-dev \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            rsync \
            unzip \
            wget \
            zip \
            zstd

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ steps.cfg.outputs.model_code }}-${{ steps.cfg.outputs.effective_root }}-${{ inputs.hook_mode }}-${{ inputs.recovery }}-${{ inputs.gpu_max }}-${{ hashFiles('build.sh') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ steps.cfg.outputs.model_code }}-${{ steps.cfg.outputs.effective_root }}-
            ccache-${{ runner.os }}-${{ steps.cfg.outputs.model_code }}-

      - name: Configure ccache
        run: |
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          echo "CCACHE_NOHASHDIR=1" >> "$GITHUB_ENV"
          echo "CCACHE_SLOPPINESS=file_macro,locale,time_macros" >> "$GITHUB_ENV"
          ccache --max-size=3G
          ccache -s

      - name: Setup Root (OriginSU / RKSU) and kernel config fragment
        run: |
          rm -rf ./KernelSU ./KernelSU-Next ./drivers/KernelSU ./drivers/kernelsu
          sed -i "s/printf '%s' -dirty/:/g" scripts/setlocalversion 2>/dev/null || true

          FRAG="$RUNNER_TEMP/extra.config"
          : > "$FRAG"

          if [ "${{ steps.cfg.outputs.effective_root }}" = "rksu" ]; then
            echo "Setting up RKSU (susfs-rksu-master)..."
            curl -LSs --fail --retry 3 \
              "https://raw.githubusercontent.com/cyberc3dr/KernelSU/susfs-rksu-master/kernel/setup.sh" \
              | bash -s susfs-rksu-master

          elif [ "${{ steps.cfg.outputs.effective_root }}" = "originsu" ]; then
            ORIGINSU_TAG="${{ steps.cfg.outputs.originsu_tag }}"
            echo "Setting up OriginSU ($ORIGINSU_TAG)..."

            if [ "${{ inputs.hook_mode }}" = "susfs" ] && [ "${{ inputs.susfs_version }}" = "v2.4.0" ]; then
              bash "$RUNNER_TEMP/origin-builder/scripts/susfs_v2.4.sh" "$RUNNER_TEMP/origin-builder/scripts"
            fi

            curl -LSs --fail --retry 3 \
              "https://raw.githubusercontent.com/samakshkambxj/OriginSU/main/kernel/setup.sh" \
              | bash -s "$ORIGINSU_TAG"
            [ -e drivers/kernelsu/Kconfig ] || { echo "::error::drivers/kernelsu missing after OriginSU setup.sh"; exit 1; }
            sed -i 's/\$(KSU_COMMIT_SHA)-dirty/$(KSU_COMMIT_SHA)/' KernelSU/kernel/Kbuild 2>/dev/null || true

            bash "$RUNNER_TEMP/origin-builder/scripts/originsu_compat_4.14.sh"
            bash "$RUNNER_TEMP/origin-builder/scripts/originsu_hooks_4.14.sh"

            # Prevent build.sh from overwriting OriginSU with cyberc3dr/KernelSU
            sed -i '/cyberc3dr\/KernelSU/d' build.sh 2>/dev/null || true

            {
              echo "CONFIG_KSU=y"
              echo "CONFIG_KSU_MULTI_MANAGER_SUPPORT=y"
              echo "# CONFIG_KSU_DEBUG is not set"
              if [ "${{ inputs.kpm }}" = "true" ]; then
                echo "CONFIG_KPM=y"
              else
                echo "# CONFIG_KPM is not set"
              fi
              if [ "${{ inputs.hook_mode }}" = "susfs" ]; then
                echo "# CONFIG_KSU_MANUAL_HOOK is not set"
                echo "CONFIG_KSU_SUSFS=y"
                for o in SUS_PATH SUS_MOUNT SUS_KSTAT SPOOF_UNAME ENABLE_LOG HIDE_KSU_SUSFS_SYMBOLS \
                         SPOOF_CMDLINE_OR_BOOTCONFIG OPEN_REDIRECT SUS_MAP; do
                  echo "CONFIG_KSU_SUSFS_${o}=y"
                done
              else
                echo "# CONFIG_KSU_SUSFS is not set"
                echo "CONFIG_KSU_MANUAL_HOOK=y"
              fi
            } >> "$FRAG"
          fi

          if [ "${{ inputs.extra_features }}" = "true" ]; then
            GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
              bash "$RUNNER_TEMP/origin-builder/scripts/extra_features.sh" "$FRAG"
          fi

          if [ -s "$FRAG" ]; then
            echo "--- Applying config fragment ---"
            cat "$FRAG"
            MODEL_CODE="${{ steps.cfg.outputs.model_code }}"
            for cfg in arch/arm64/configs/*${MODEL_CODE}*defconfig arch/arm64/configs/exynos9820*defconfig; do
              [ -f "$cfg" ] && cat "$FRAG" >> "$cfg"
            done
          fi

      - name: Build kernel
        run: |
          chmod +x build.sh
          ./build.sh \
            --model "${{ steps.cfg.outputs.model_code }}" \
            --ksu "${{ steps.cfg.outputs.include_ksu }}" \
            --recovery "${{ inputs.recovery }}" \
            --gpu-max "${{ inputs.gpu_max }}"

      - name: ccache stats after build
        run: ccache -s

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.cfg.outputs.effective_root }}-${{ steps.cfg.outputs.originsu_tag }}-${{ inputs.hook_mode }}-kernel-${{ steps.cfg.outputs.model_code }}-rec${{ inputs.recovery }}-gpu${{ inputs.gpu_max }}
          path: |
            build/out/**/Image
            build/out/**/boot.img
            build/out/**/dtb.img
            build/out/**/dtbo.img
            build/out/**/zip/*.zip
          if-no-files-found: warn
